name: Update status

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest run for each repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          repos='[
            {"repo":"openmrs-module-pihapps","workflow":"deploy.yml","label":"Deploy"},
            {"repo":"openmrs-module-pihcore","workflow":"deploy.yml","label":"Deploy"},
            {"repo":"pihemr","workflow":"build-and-deploy-to-openmrs-jfrog.yml","label":"Build and deploy"},
            {"repo":"ces-emr","workflow":"build-and-deploy-to-openmrs-jfrog.yml","label":"Build and deploy"},
            {"repo":"lesotho-emr","workflow":"build-and-deploy-to-openmrs-jfrog.yml","label":"Build and deploy"},
            {"repo":"pihliberia-emr","workflow":"build-and-deploy-to-openmrs-jfrog.yml","label":"Build and deploy"},
            {"repo":"pihsl-emr","workflow":"build-and-deploy-to-openmrs-jfrog.yml","label":"Build and deploy"},
            {"repo":"zl-emr","workflow":"build-and-deploy-to-openmrs-jfrog.yml","label":"Build and deploy"}
          ]'

          out='[]'
          while IFS= read -r row; do
            repo=$(echo "$row" | jq -r '.repo')
            workflow=$(echo "$row" | jq -r '.workflow')
            label=$(echo "$row" | jq -r '.label')

            run=$(gh api "repos/PIH/${repo}/actions/workflows/${workflow}/runs?per_page=1" --jq '.workflow_runs[0] // {}')

            entry=$(jq -n \
              --arg repo "$repo" \
              --arg label "$label" \
              --argjson run "$run" \
              '{
                repo: $repo,
                workflow_label: $label,
                status: $run.status,
                conclusion: $run.conclusion,
                run_number: $run.run_number,
                head_branch: $run.head_branch,
                run_started_at: $run.run_started_at,
                updated_at: $run.updated_at,
                html_url: $run.html_url
              }')

            out=$(echo "$out" | jq --argjson e "$entry" '. + [$e]')
          done < <(echo "$repos" | jq -c '.[]')

          jq -n --argjson repos "$out" --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{generated_at: $generated_at, repos: $repos}' > status.json

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp status.json _site/status.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
